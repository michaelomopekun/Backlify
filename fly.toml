# fly.toml app configuration file for Backlify worker
# Generated for deployment to Fly.io

app = "backlify-worker"
primary_region = "fra"

[build]
  dockerfile = "app/worker/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  PG_DUMP_PATH = "pg_dump"
  PG_RESTORE_PATH = "pg_restore"
  NODE_OPTIONS = "--max-old-space-size=384"


[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
