# fly.toml app configuration file for Backlify worker
# Generated for deployment to Fly.io

app = "backlify-worker"
primary_region = "fra"

[build]
  dockerfile = "app/worker/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  PG_DUMP_PATH = "pg_dump"
  PG_RESTORE_PATH = "pg_restore"
  NODE_OPTIONS = "--max-old-space-size=384"

# Health check HTTP endpoint
[http_service]
  internal_port = 8080
  force_https = true
  # CRITICAL: Do NOT auto-stop machines.
  # This is a background queue worker that must stay awake 24/7 to process BullMQ/Redis jobs.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
